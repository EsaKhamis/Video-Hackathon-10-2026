[project]
name = "videoagent"
version = "0.1.0"
description = "Real-time video agent: VAST search + YOLO11 filter + Cosmos Reason 2 + LLM agent"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "opencv-python>=4.9",
    "streamlit>=1.38",
    "weave>=0.51",
]

[project.optional-dependencies]
# Local YOLO11 tracking for the real-time lane. Pulls in PyTorch; not needed for archive search.
realtime = [
    "ultralytics>=8.3",
    "lap>=0.5.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoagent"]
